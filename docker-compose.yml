version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: finai_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: finance_db
      MYSQL_USER: finance_user
      MYSQL_PASSWORD: finance_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Web Application Service
  web:
    build: .
    container_name: finai_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: super-secret-production-key-change-me
      USE_MYSQL: 'true'
      DATABASE_URL: mysql+pymysql://finance_user:finance_password@db:3306/finance_db
      FLASK_DEBUG: 'False'
    ports:
      - "5000:5000"
    volumes:
      - .:/app

volumes:
  mysql_data:
